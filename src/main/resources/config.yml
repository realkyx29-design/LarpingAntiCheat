# =====================================================================
# LarpingAntiCheat - Production Configuration
# Focused on patching modern cheat clients (TikTok / Web cheat clients)
# Conservative & Custom-SMP friendly for Paper 1.21.11
# =====================================================================

alerts:
  enabled: true
  format: "[LAC] Player §f%player% §7failed §f%check% §7(VL: §c%vl%§7, Ping: §e%ping%ms§7, TPS: §e%tps%§7)"

logging:
  enabled: false
  include-location: true

exempt-permission: "lac.bypass"
violation-decay-per-second: 0.20

compensation:
  ping: true
  tps: true

grace-periods:
  teleport: 1000
  velocity: 500
  damage: 500
  join: 2000
  respawn: 2000
  world-change: 1500

setbacks:
  enabled: true
  conservative-only: true

punishments:
  enabled: false
  actions:
    - threshold: 30
      command: "kick %player% Suspicious activity detected"
    - threshold: 60
      command: "ban %player% Unfair advantage detected"

compatibility:
  custom-mods:
    enabled: true
    movement-compensation: true
    velocity-compensation: true
    combat-compensation: true
    block-placement-compensation: true

checks:
  speed:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    max-horizontal-per-tick: 0.85
    min-confirmations: 8

  fly:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    air-ticks: 55
    min-confirmations: 8

  reach:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    max-distance: 3.85
    min-confirmations: 6

  scaffold:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    max-placements-per-sec: 25
    min-confirmations: 6

  timer:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    min-confirmations: 12

  groundspoof:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0

  phase:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0

  rotation:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0

  freecam:
    enabled: true
    sensitivity: 0.4
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
