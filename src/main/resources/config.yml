# =====================================================================
# LarpingAntiCheat - Production Configuration
# Focused on patching modern cheat clients (TikTok / Web cheat clients)
# Conservative & Custom-SMP friendly for Paper 1.21.11
# =====================================================================

alerts:
  enabled: true
  format: "[LAC] Player §f%player% §7failed §f%check% §7(VL: §c%vl%§7, Ping: §e%ping%ms§7, TPS: §e%tps%§7)"

logging:
  enabled: false
  include-location: true

exempt-permission: "lac.bypass"
violation-decay-per-second: 0.15

compensation:
  ping: true
  tps: true

grace-periods:
  teleport: 1000
  velocity: 500
  damage: 500
  join: 1500
  respawn: 1500
  world-change: 1000

setbacks:
  enabled: true
  conservative-only: true

punishments:
  enabled: false
  actions:
    - threshold: 25
      command: "kick %player% Suspicious activity detected"
    - threshold: 50
      command: "ban %player% Unfair advantage detected"

compatibility:
  custom-mods:
    enabled: true
    movement-compensation: true
    velocity-compensation: true
    combat-compensation: true
    block-placement-compensation: true

checks:
  speed:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-horizontal-per-tick: 0.78
    min-confirmations: 5

  fly:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    air-ticks: 40
    min-confirmations: 6

  reach:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-distance: 3.65
    min-confirmations: 4

  scaffold:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-placements-per-sec: 22
    min-confirmations: 4

  timer:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-packet-rate: 25

  groundspoof:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 4.0
    setback-threshold: 8.0
    punishment-threshold: 20.0

  phase:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 4.0
    setback-threshold: 8.0
    punishment-threshold: 20.0

  rotation:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-delta-yaw: 180.0

  freecam:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-distance: 12.0
