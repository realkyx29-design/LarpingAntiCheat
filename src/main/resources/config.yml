# =====================================================================
# LarpingAntiCheat - Production Configuration
# Conservative, custom-SMP friendly anti-cheat for Paper 1.21.11
# =====================================================================

# Global switch for administrator violation alert broadcasts
alerts:
  enabled: true
  format: "[LAC] Player §f%player% §7failed §f%check% §7(VL: §c%vl%§7, Ping: §e%ping%ms§7, TPS: §e%tps%§7)"

# Global logging of anti-cheat violations to console/file
logging:
  enabled: false
  include-location: true

# Permission required to bypass all checks entirely
exempt-permission: "lac.bypass"

# Violation decay rate per second (reduces false accumulation over time)
violation-decay-per-second: 0.15

# Global Ping and TPS Compensation (makes detection more conservative under lag)
compensation:
  ping: true
  tps: true

# Grace periods in milliseconds (prevents false positives after server events)
grace-periods:
  teleport: 1000
  velocity: 500
  damage: 500
  join: 1500
  respawn: 1500
  world-change: 1000

# Setback system (teleports player back to safe location upon excessive violations)
setbacks:
  enabled: true
  conservative-only: true

# Punishments are DISABLED by default. Never automatically ban players by default.
punishments:
  enabled: false
  actions:
    - threshold: 25
      command: "kick %player% Suspicious activity detected"
    - threshold: 50
      command: "ban %player% Unfair advantage detected"

# Custom Mod & SMP Compatibility settings
compatibility:
  custom-mods:
    enabled: true
    movement-compensation: true
    velocity-compensation: true
    combat-compensation: true
    block-placement-compensation: true

# Individual check configurations
# Sensitivity: 0.1 (very tolerant) to 1.0 (strict). Conservative defaults used.
checks:
  speed:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-horizontal-per-tick: 0.78
    min-confirmations: 5

  fly:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    air-ticks: 40
    min-confirmations: 6

  reach:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-distance: 3.65
    min-confirmations: 4

  autoclicker:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 6.0
    setback-threshold: 12.0
    punishment-threshold: 30.0
    max-cps: 20
    min-samples: 45

  scaffold:
    enabled: true
    sensitivity: 0.5
    alert-threshold: 5.0
    setback-threshold: 10.0
    punishment-threshold: 25.0
    max-placements-per-sec: 22
    min-confirmations: 4
