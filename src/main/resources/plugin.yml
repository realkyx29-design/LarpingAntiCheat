name: LarpingAntiCheat
version: 1.0.0
main: me.larping.anticheat.LarpingAntiCheat
api-version: '1.21'
author: Larping
website: https://github.com/realkyx29-design/LarpingAntiCheat
description: Production-ready anti-cheat for Paper 1.21.11 custom SMP servers, focusing on blocking cheat clients and exploits.
commands:
  lac:
    description: LarpingAntiCheat administration and check management
    usage: /lac <checks|enable|disable|reload|alerts|violations|clear|debug>
    permission: lac.admin
permissions:
  lac.admin:
    description: Full administration access for LarpingAntiCheat
    default: op
  lac.alerts:
    description: Receive anti-cheat alert broadcasts
    default: op
  lac.bypass:
    description: Bypass anti-cheat checks entirely
    default: false
  lac.debug:
    description: View check debug information for players
    default: op
  lac.verbose:
    description: Receive the detailed verbose/debug feed and setback notices
    default: false
